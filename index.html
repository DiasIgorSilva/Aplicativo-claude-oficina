    function compressImage(file, maxWidth = 1600, quality = 0.8) {



      return new Promise((resolve, reject) => {



        const reader = new FileReader();



        reader.readAsDataURL(file);



        reader.onload = (e) => {



          const img = new Image();



          img.src = e.target.result;



          img.onload = () => {



            let width = img.width;



            let height = img.height;



            if (width > maxWidth || height > maxWidth) {



              if (width > height) {



                height = Math.round((height * maxWidth) / width);



                width = maxWidth;



              } else {



                width = Math.round((width * maxWidth) / height);



                height = maxWidth;



              }



            }



            const canvas = document.createElement('canvas');



            canvas.width = width;



            canvas.height = height;



            const ctx = canvas.getContext('2d');



            if (ctx) ctx.drawImage(img, 0, 0, width, height);



            const dataUrl = canvas.toDataURL('image/jpeg', quality);



            const base64 = dataUrl.split(',')[1];



            resolve({ base64, mimeType: 'image/jpeg', dataUrl });



          };



          img.onerror = (err) => reject(err);



        };



        reader.onerror = (err) => reject(err);



      });



    }

            .nav-item.active { color: #f97316; }







            .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; backdrop-filter: blur(4px); }



            .table-wrap { width: 100%; overflow-x: auto; border-radius: 12px; }



            .table-header { display: grid; grid-template-columns: 2fr 1.3fr 1fr 1fr 110px; padding: 12px 16px; background: #0b0d14; border-bottom: 1px solid #1c2234; color: #64748b; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; min-width: 680px; }



            .table-row { display: grid; grid-template-columns: 2fr 1.3fr 1fr 1fr 110px; padding: 14px 16px; border-bottom: 1px solid #1c2234; align-items: center; min-width: 680px; transition: background 0.2s; }



            .table-row:last-child { border-bottom: none; }



            .table-row:hover { background: rgba(255,255,255,0.02); }







            .modal { background: #141824; border: 1px solid #1c2234; border-radius: 20px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }







            @media (max-width: 767px) {



              .header-bar { padding: 10px 14px; }



              .nav-desktop-tabs { display: none; }



              .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }



              .kpi-number { font-size: 17px; }



              .card { padding: 14px; border-radius: 12px; }



            }



          `}</style>







          {/* HEADER NAVEGAÇÃO */}



          <header className="header-bar">



            <div className="logo-box">



              <div className="logo-icon">🚘</div>



              <div className="logo-title">ASDCAR</div>



            </div>







            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>



              <button className={`pill-badge ${driveUrl ? "active-green" : ""}`} onClick={() => setShowDriveModal(true)}>



                ☁️ {driveUrl ? "Drive Ok" : "Conectar Drive"}



              </button>



              <button className="pill-badge purple-btn" onClick={() => setShowReport(true)}>📄 Fechamento</button>



            </div>







            <div className="nav-desktop-tabs">



              {tabs.map(t => (



                <button key={t.id} className={`tab-btn ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>



                  <span>{t.icon}</span> {t.label}



                </button>



              ))}



            </div>



          </header>







          {/* CONTEÚDO PRINCIPAL */}



          <main style={{ padding: 16, flex: 1, maxWidth: 1200, margin: "0 auto", width: "100%" }}>



            {loading ? (



              <div style={{ padding: 60, textAlign: "center", color: "#f97316", fontSize: 15, fontWeight: 700 }}>



                🚗 Carregando dados da oficina...



              </div>



            ) : (



              <>



                {tab === "dashboard" && <Dashboard services={services} viewMode={globalViewMãode} setViewMãode={setGlobalViewMãode} onEditService={handleEditCar} />}



                {tab === "services" && <ServicesTab services={services} vehicles={vehicles} loadAll={loadAll} onOpenOS={(s) => setShowOSModal(s)} driveUrl={driveUrl} onOpenDriveConfig={() => setShowDriveModal(true)} onZoomPhoto={(p) => setZoomPhoto(p)} externalModalService={serviceModalToOpen} onClearExternalModal={() => setServiceModalToOpen(null)} />}



                {tab === "monthly_history" && <MonthlyHistoryTab services={services} vehicles={vehicles} onOpenOS={(s) => setShowOSModal(s)} onZoomPhoto={(p) => setZoomPhoto(p)} onEditService={handleEditCar} />}





                {tab === "finance" && <FinanceTab expenses={expenses} services={services} loadAll={loadAll} viewMode={globalViewMãode} setViewMãode={setGlobalViewMãode} />}



                {tab === "vehicles" && <VehiclesTab vehicles={vehicles} services={services} loadAll={loadAll} onZoomPhoto={(p) => setZoomPhoto(p)} />}



              </>



            )}



          </main>







          {/* BARRA INFERIOR MOBILE */}



          <nav className="bottom-nav">



            <div style={{ display: "flex", justifyContent: "space-around", maxWidth: 600, margin: "0 auto" }}>



              {tabs.map(t => (



                <button key={t.id} className={`nav-item ${tab === t.id ? "active" : ""}`} onClick={() => setTab(t.id)}>



                  <span style={{ fontSize: 20 }}>{t.icon}</span>



                  <span>{t.label}</span>



                </button>



              ))}



            </div>



          </nav>







          {/* MODAIS */}



          {showReport && <ReportModal services={services} viewMode={globalViewMãode} onClose={() => setShowReport(false)} onGenerate={(f, t) => { generatePDF(vehicles, services, expenses, f, t, globalViewMãode); setShowReport(false); }} />}



          {showDriveModal && (



            <DriveModal 



              driveUrl={driveUrl} 



              onSave={(url) => { if (typeof window !== "undefined") { localStorage.setItem("asdcar_drive_url", url); } setDriveUrl(url); }} 



              onClose={() => setShowDriveModal(false)} 



            />



          )}



          {zoomPhoto && <PhotoZoomModal photo={zoomPhoto} onClose={() => setZoomPhoto(null)} />}

        </div>



      );



    }







    // ── ABA INÍCIO ─────────────────────────────────────────────────────────────



    function Dashboard({ services, viewMode, setViewMãode, onEditService }) {



      const [selMonth, setSelMonth] = useState(new Date().getMonth());



      const [selYear, setSelYear] = useState(new Date().getFullYear());







      const activeServices = services.filter((s) => s.status !== "Entregue");



      const filteredDelivered = services.filter((s) => {



        if (s.status !== "Entregue") return false;



        const dateStr = s.exitDate || s.entryDate || (s.createdAt ? s.createdAt.slice(0, 10) : null);



        if (!dateStr) return true;



        const d = new Date(dateStr + "T12:00:00");



        return d.getMonth() === selMonth && d.getFullYear() === selYear;



      });







      const tP = filteredDelivered.reduce((acc, s) => acc + (Number(s.partsValue) || 0), 0);



      const tL = filteredDelivered.reduce((acc, s) => acc + (Number(s.laborValue) || 0), 0);







      const receitaCalculada = filteredDelivered.reduce((acc, s) => {



        if (s.paymentMethod === "Múltiplo / Misto") {



          const taxaCard = PAYMENT_METHODS[s.mixedCardMethod] || 0;



          const dinheiroPixLivre = Number(s.mixedCash || 0);



          



          if (viewMode === "labor") {



            const totalBrutoServico = (Number(s.partsValue) || 0) + (Number(s.laborValue) || 0);



            if (totalBrutoServico <= 0) return acc;



            const percentualLabor = Number(s.laborValue) / totalBrutoServico;



            



            const cashProporcional = dinheiroPixLivre * percentualLabor;



            const cardProporcionalBruto = Number(s.mixedCard || 0) * percentualLabor;



            const cardProporcionalLiquido = cardProporcionalBruto * (1 - taxaCard / 100);



            



            return acc + cashProporcional + cardProporcionalLiquido;



          } else {



            const cardLiquido = Number(s.mixedCard || 0) * (1 - taxaCard / 100);



            return acc + dinheiroPixLivre + cardLiquido;



          }



        }







        const taxa = PAYMENT_METHODS[s.paymentMethod] || 0;



        if (viewMode === "labor") {



          return acc + (Number(s.laborValue || 0) * (1 - taxa / 100));



        } else {



          return acc + (s.netValue || 0);



        }



      }, 0);







      return (



        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>



          {/* FILTROS DO PAINEL */}



          <div className="card" style={{ display: "flex", flexDirection: "column", gap: 12 }}>



            <div style={{ display: "grid", gridTemplateColumns: "1fr 100px 1.5fr", gap: 12 }}>



              <div>



                <label className="label">MÊS DE REFERÊNCIA</label>



                <select className="input" value={selMonth} onChange={(e) => setSelMonth(Number(e.target.value))}>



                  {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}



                </select>



              </div>



              <div>



                <label className="label">ANO</label>



                <select className="input" value={selYear} onChange={(e) => setSelYear(Number(e.target.value))}>



                  {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}



                </select>



              </div>



              <div>



                <label className="label">MODELO DE FILTRO (PAINEL & PDF)</label>



                <select className="input" value={viewMode} onChange={(e) => setViewMãode(e.target.value)}>



                  <option value="labor">Mão de Obra Líquida (Desconta taxas de cartão)</option>



                  <option value="total">Bruto Total (M.O. + Peças)</option>



                </select>



              </div>



            </div>



          </div>







          {/* KPI GRID COM BADGES COLORIDOS */}



          <div className="kpi-grid">



            <div className="kpi-card" style={{ borderColor: "rgba(249, 115, 22, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(249, 115, 22, 0.15)", color: "#f97316" }}>🔧</div>



              <div className="kpi-number">{activeServices.length}</div>



              <div className="kpi-label">PÁTIO OFICINA</div>



            </div>







            <div className="kpi-card" style={{ borderColor: "rgba(139, 92, 246, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(139, 92, 246, 0.15)", color: "#8b5cf6" }}>🎧</div>



              <div className="kpi-number">{fmt(tP)}</div>



              <div className="kpi-label">PEÇAS ({MONTHS[selMonth].slice(0,3).toUpperCase()})</div>



            </div>







            <div className="kpi-card" style={{ borderColor: "rgba(16, 185, 129, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(16, 185, 129, 0.15)", color: "#10b981" }}>🔧</div>



              <div className="kpi-number">{fmt(tL)}</div>



              <div className="kpi-label">M.O. ({MONTHS[selMonth].slice(0,3).toUpperCase()})</div>



            </div>







            <div className="kpi-card" style={{ borderColor: "rgba(245, 158, 11, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(245, 158, 11, 0.15)", color: "#f59e0b" }}>💳</div>



              <div className="kpi-number">{fmt(filteredDelivered.length > 0 ? (tL / filteredDelivered.length) : 0)}</div>



              <div className="kpi-label">TICKET MÉDIO M.O.</div>



            </div>







            <div className="kpi-card" style={{ borderColor: "rgba(59, 130, 246, 0.3)" }}>



              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>



                <div className="kpi-icon-badge" style={{ background: "rgba(59, 130, 246, 0.15)", color: "#3b82f6" }}>💳</div>



                <span style={{ fontSize: 9, fontWeight: 800, color: "#10b981", letterSpacing: 1 }}>LÍQUIDO</span>



              </div>



              <div className="kpi-number" style={{ color: "#10b981" }}>{fmt(receitaCalculada)}</div>



              <div className="kpi-label">{viewMode === "labor" ? "M.O. LÍQUIDA" : "FATURAMENTO LÍQ."}</div>



            </div>



          </div>







          {/* LISTA DE VEÍCULOS NO PÁTIO */}



          <div className="card">



            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>



              <h3 style={{ fontSize: 16, fontWeight: 800, fontFamily: "'Syne', sans-serif", display: "flex", alignItems: "center", gap: 8 }}>



                🛠️ Carros na Oficina ({activeServices.length})



              </h3>



              <span style={{ fontSize: 11, color: "#f97316", fontWeight: 700 }}>💡 Clique no carro para alterar</span>



            </div>



            {activeServices.length === 0 ? (



              <p style={{ fontSize: 12, color: "#64748b" }}>Nenhum veículo em atendimento no momento.</p>



            ) : (



              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>



                {activeServices.map((s) => {



                  const statusClass = "status-" + (s.status || "Aguardando").replace(/ /g, "-");



                  return (



                    <div 



                      key={s.id} 



                      className="workshop-car-card"



                      onClick={() => onEditService && onEditService(s)}



                      style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", background: "#0b0d14", borderRadius: 12, border: "1px solid #1c2234" }}



                      title="Clique para abrir e editar o andamento deste serviço"



                    >



                      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>



                        <div className="plate-badge">



                          <div className="plate-top">BRASIL</div>



                          <div className="plate-number">{s.vehiclePlate}</div>



                        </div>



                        <div>



                          <div style={{ fontSize: 14, fontWeight: 700, color: "#f8fafc" }}>{s.vehicleBrand} {s.vehicleModel}</div>



                          <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>{(s.description || "").split("||")[0]}</div>



                        </div>



                      </div>



                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>



                        <span className={`status-pill ${statusClass}`}>{s.status}</span>



                        <button className="btn-ghost" style={{ padding: "6px 10px", fontSize: 11 }}>✏️ Editar</button>



                      </div>



                    </div>



                  );



                })}



              </div>



            )}



          </div>







          {/* LISTA DE ENTREGUES NO MÊS */}



          <div className="card">



            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>



              <h3 style={{ fontSize: 16, fontWeight: 800, fontFamily: "'Syne', sans-serif", color: "#10b981", display: "flex", alignItems: "center", gap: 8 }}>



                📋 Carros que Passaram no Mês ({filteredDelivered.length})



              </h3>



              <span style={{ fontSize: 11, color: "#10b981", fontWeight: 700 }}>💡 Clique no carro para alterar</span>



            </div>



            {filteredDelivered.length === 0 ? (



              <p style={{ fontSize: 12, color: "#64748b" }}>Nenhum veículo entregue em {MONTHS[selMonth]} de {selYear}.</p>



            ) : (



              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>



                {filteredDelivered.map((s) => (



                  <div 



                    key={s.id} 



                    className="workshop-car-card"



                    onClick={() => onEditService && onEditService(s)}



                    style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", background: "#0b0d14", borderRadius: 12, border: "1px solid #1c2234" }}



                    title="Clique para abrir e ver/editar detalhes deste serviço"



                  >



                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>



                      <div className="plate-badge">



                        <div className="plate-top">BRASIL</div>



                        <div className="plate-number">{s.vehiclePlate}</div>



                      </div>



                      <div>



                        <div style={{ fontSize: 14, fontWeight: 700, color: "#f8fafc" }}>{s.vehicleBrand} {s.vehicleModel}</div>



                        <div style={{ fontSize: 11, color: "#10b981", marginTop: 2 }}>Entregue em: {fmtDate(s.exitDate || s.entryDate)} · {(s.description || "").split("||")[0]}</div>



                      </div>



                    </div>



                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>



                      <div style={{ fontSize: 13, fontWeight: 800, color: "#10b981" }}>{fmt((Number(s.partsValue)||0) + (Number(s.laborValue)||0))}</div>



                      <button className="btn-ghost" style={{ padding: "6px 10px", fontSize: 11 }}>✏️ Editar</button>



                    </div>



                  </div>



                ))}



              </div>



            )}



          </div>



        </div>



      );



    }







    // ── ABA OFICINA ────────────────────────────────────────────────────────────



    function ServicesTab({ services, vehicles, loadAll, onOpenOS, driveUrl, onOpenDriveConfig, onZoomPhoto, externalModalService, onClearExternalModal }) {



      const [modal, setModal] = useState(false);



      const [editing, setEditing] = useState(null);



      const [form, setForm] = useState({});



      



      const [partsOwner, setPartsOwner] = useState("oficina"); 



      const [oficinaPartsText, setOficinaPartsText] = useState("");



      const [clientePartsText, setClientePartsText] = useState("");



      const [filterStatus, setFilterStatus] = useState("");







      const [photoType, setPhotoType] = useState("Vistoria / Avarias");



      const [uploadingPhoto, setUploadingPhoto] = useState(false);



      const cameraInputRef = useRef(null);



      const galleryInputRef = useRef(null);







      useEffect(() => {



        if (externalModalService) {



          open(externalModalService);



          if (onClearExternalModal) onClearExternalModal();



        }



      }, [externalModalService]);







      const open = (s = null) => { 



        setEditing(s); 



        let initialOwner = "oficina";



        let ofiText = "";



        let cliText = "";



        let photosList = [];



        if (s) {



          if (s.description?.includes("|| Peças Oficina:")) {



            initialOwner = "mista";



            const partes = (s.description || "").split("||");



            ofiText = partes[1]?.replace("Peças Oficina:", "")?.trim() || "";



            cliText = partes[2]?.replace("Peças Cliente:", "")?.trim() || "";



          } else if (s.description?.includes("(Cliente forneceu as peças)")) {



            initialOwner = "cliente";



          }



          photosList = Array.isArray(s.photos) ? s.photos : (typeof s.photos === 'string' ? JSON.parse(s.photos || '[]') : []);



        }



        setPartsOwner(initialOwner);



        setOficinaPartsText(ofiText);



        setClientePartsText(cliText);



        setForm(s ? { ...s, photos: photosList } : { status: "Aguardando", description: "", partsValue: 0, laborValue: 0, entryDate: today(), paymentMethod: "Dinheiro", mixedCash: 0, mixedCard: 0, mixedCardMethod: "Débito", photos: [] }); 



        setModal(true); 



      };







      const handleUploadPhoto = async (e) => {



        const file = e.target.files?.[0];



        if (!file) return;







        const selectedVehicle = vehicles.find(veh => veh.id === form.vehicleId || veh.id === form.vehicle_id);



        const rawPlate = form.vehiclePlate || form.vehicle_plate || selectedVehicle?.plate || "GERAL";



        const cleanPlate = rawPlate.replace(/[^a-zA-Z0-9]/g, "").toUpperCase() || "GERAL";



        const plate = "PLACA_" + cleanPlate;







        setUploadingPhoto(true);



        try {



          const compressed = await compressImage(file, 1400, 0.75);







          let savedUrl = compressed.dataUrl;



          let driveLink = compressed.dataUrl;



          let driveFileId = null;



          let driveSuccess = false;







          if (driveUrl) {



            try {



              const payload = {



                folderName: plate,



                fileName: `${photoType.replace(/\//g, "_")}_${Date.now()}.jpg`,



                base64: compressed.base64,



                mimeType: "image/jpeg"



              };







              const res = await fetch(driveUrl, {



                method: "POST",



                headers: { "Content-Type": "text/plain;charset=utf-8" },



                body: JSON.stringify(payload)



              });



              



              const data = await res.json();



              if (data && (data.status === "success" || data.fileUrl)) {



                savedUrl = data.fileUrl || compressed.dataUrl;



                driveLink = data.driveLink || data.fileUrl;



                driveFileId = data.fileId || null;



                driveSuccess = true;



              }



            } catch (driveErr) {



              try {



                const payload = {



                  folderName: plate,



                  fileName: `${photoType.replace(/\//g, "_")}_${Date.now()}.jpg`,



                  base64: compressed.base64,



                  mimeType: "image/jpeg"



                };



                fetch(driveUrl, {



                  method: "POST",



                  mode: "no-cors",



                  headers: { "Content-Type": "text/plain;charset=utf-8" },



                  body: JSON.stringify(payload)



                }).catch(() => {});



                driveSuccess = true;



              } catch(e) {}



            }



          }







          const newPhoto = {



            url: savedUrl,



            driveLink: driveLink,



            fileId: driveFileId,



            type: photoType,



            driveSaved: driveSuccess,



            createdAt: new Date().toISOString()



          };







          const updatedPhotos = [...(form.photos || []), newPhoto];



          setForm({ ...form, photos: updatedPhotos });







        } catch (err) {



          alert("Erro ao carregar imagem: " + (err.message || "Arquivo não suportado"));



        } finally {



          setUploadingPhoto(false);



          if (cameraInputRef.current) cameraInputRef.current.value = "";



          if (galleryInputRef.current) galleryInputRef.current.value = "";



        }



      };







      const handleDeletePhoto = (idxToRemove) => {



        const photoToDelete = (form.photos || [])[idxToRemove];



        if (photoToDelete && driveUrl) {



          try {



            fetch(driveUrl, {



              method: "POST",



              headers: { "Content-Type": "text/plain;charset=utf-8" },



              body: JSON.stringify({



                action: "delete",



                fileId: photoToDelete.fileId,



                fileUrl: photoToDelete.url



              })



            }).catch(() => {});



          } catch (err) {}



        }



        const updatedPhotos = (form.photos || []).filter((_, idx) => idx !== idxToRemove);



        setForm({ ...form, photos: updatedPhotos });



      };



      const close = () => { setModal(false); setEditing(null); setForm({}); };







      

      const deleteService = async (serviceId) => {

        if (!serviceId) return;

        if (confirm("Tem certeza que deseja excluir este serviço?")) {

          const { error } = await supabaseClient.from("services").delete().eq("id", serviceId);

          if (!error) {

            await loadAll(false);

            alert("Serviço excluído com sucesso!");

          } else {

            alert("Erro ao excluir: " + error.message);

          }

        }

      };



      const save = async () => {



        const vId = form.vehicleId || form.vehicle_id || editing?.vehicleId || editing?.vehicle_id;



        if (!vId || !form.description) return alert("Selecione o veículo e descreva o serviço.");







        const v = vehicles.find(veh => String(veh.id) === String(vId));



        const plate = v?.plate || form.vehiclePlate || form.vehicle_plate || editing?.vehiclePlate || "";



        const brand = v?.brand || form.vehicleBrand || form.vehicle_brand || editing?.vehicleBrand || "";



        const model = v?.model || form.vehicleModel || form.vehicle_model || editing?.vehicleModel || "";







        let descLimpa = (form.description || "").split("||")[0].replace(/\s*\(Cliente forneceu as peças\)/gi, "").trim();



        let finalPartsValue = Number(form.partsValue) || 0;







        if (partsOwner === "cliente") {



          descLimpa += " (Cliente forneceu as peças)";



          finalPartsValue = 0;



        } else if (partsOwner === "mista") {



          descLimpa += ` || Peças Oficina: ${oficinaPartsText || "Especificadas"} || Peças Cliente: ${clientePartsText || "Especificadas"}`;



        }







        let liquido = 0;



        const bruto = finalPartsValue + (Number(form.laborValue) || 0);



        const metodoCartaoMisto = form.mixed_card_method || form.mixedCardMethod || "Débito";







        if (form.paymentMethod === "Múltiplo / Misto") {



          const taxaCard = PAYMENT_METHODS[metodoCartaoMisto] || 0;



          const parteCash = Number(form.mixedCash) || 0;



          const parteCard = Number(form.mixedCard) || 0;



          liquido = parteCash + (parteCard * (1 - taxaCard / 100));



        } else {



          const taxa = PAYMENT_METHODS[form.paymentMethod || "Dinheiro"] || 0;



          liquido = bruto - (bruto * (taxa / 100));



        }







        const row = { 



          id: editing?.id || form.id || uid(), 



          vehicle_id: vId, 



          vehicle_plate: plate, 



          vehicle_brand: brand, 



          vehicle_model: model, 



          description: descLimpa, 



          parts_value: finalPartsValue, 



          labor_value: Number(form.laborValue) || 0, 



          net_value: liquido, 



          status: form.status || "Aguardando", 



          entry_date: form.entryDate || today(), 



          exit_date: form.status === "Entregue" ? (form.exitDate || today()) : null, 



          payment_method: form.paymentMethod || "Dinheiro", 



          mileage: Number(form.mileage) || 0,



          mixed_cash: form.paymentMethod === "Múltiplo / Misto" ? Number(form.mixedCash) : 0,



          mixed_card: form.paymentMethod === "Múltiplo / Misto" ? Number(form.mixedCard) : 0,



          mixed_card_method: form.paymentMethod === "Múltiplo / Misto" ? metodoCartaoMisto : null,



          photos: JSON.stringify(form.photos || [])



        };



        



        if (typeof window !== "undefined" && window.localStorage && form.photos) {



          localStorage.setItem("asdcar_photos_" + row.id, JSON.stringify(form.photos));



        }







        let { error } = await supabaseClient.from("services").upsert(row);







        if (error && error.message?.includes("photos")) {



          delete row.photos;



          const retry = await supabaseClient.from("services").upsert(row);



          error = retry.error;



        }







        if (!error) { 



          await loadAll(false); 



          close(); 



        } else { 



          alert("Erro ao salvar no banco de dados: " + error.message); 



        }



      };







      const filtered = filterStatus ? services.filter(s => s.status === filterStatus) : services;



      const cols = "1.8fr 1.3fr 0.8fr 1fr 110px";







      return (



        <Section title="Fluxo Oficina" action={<button className="btn-primary" onClick={() => open()}>+ Entrada</button>}>



          <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>



            {["", ...Object.keys(STATUS_COLORS)].map(s => (



              <button key={s} onClick={() => setFilterStatus(s)} style={{ background: filterStatus === s ? "#f97316" : "transparent", color: filterStatus === s ? "#0d0f14" : "#94a3b8", border: `1px solid ${filterStatus === s ? "#f97316" : "#1c2234"}`, borderRadius: 20, padding: "6px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{s || "Todos"}</button>



            ))}



          </div>







          <div className="card" style={{ padding: 0 }}>



            <div className="table-wrap">



              <div className="table-header" style={{ gridTemplateColumns: cols }}>



                <span>Serviço</span><span>Veículo</span><span>M.O.</span><span>Status</span><span>Ações</span>



              </div>



              {filtered.map(s => {



                const statusClass = "status-" + (s.status || "Aguardando").replace(/ /g, "-");



                return (



                  <div key={s.id} className="table-row workshop-car-card" onClick={() => open(s)} style={{ gridTemplateColumns: cols, cursor: "pointer" }}>



                    <div>



                      <div style={{ color: "#f8fafc", fontWeight: 700, fontSize: 13 }}>{(s.description || "").split("||")[0]}</div>



                      <div style={{ fontSize: 11, color: "#64748b", marginTop: 3 }}>KM: {fmtKm(s.mileage)} · Entrada: {fmtDate(s.entryDate)}</div>



                    </div>



                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>



                      <div className="plate-badge" style={{ width: 75, padding: 0 }}>



                        <div className="plate-top" style={{ fontSize: 6 }}>BRASIL</div>



                        <div className="plate-number" style={{ fontSize: 11 }}>{s.vehiclePlate}</div>



                      </div>



                      <div>



                        <div style={{ fontSize: 11, fontWeight: 700, color: "#f8fafc" }}>{s.vehicleModel || s.vehicleBrand}</div>



                        <div style={{ fontSize: 10, color: "#64748b" }}>{s.vehicleBrand}</div>



                      </div>



                    </div>



                    <div style={{ fontSize: 13, fontWeight: 800, color: "#10b981" }}>{fmt(s.laborValue)}</div>



                    <div><span className={`status-pill ${statusClass}`}>{s.status}</span></div>



                    <div style={{ display: "flex", gap: 6 }} onClick={e => e.stopPropagation()}>



                      <button onClick={() => onOpenOS(s)} className="btn-primary" style={{ padding: "6px 10px", background: "#7c3aed", color: "#fff", fontSize: 10 }}>📋 O.S</button>



                      <button onClick={() => open(s)} className="btn-ghost" style={{ padding: 6 }}>✏️</button>



                    </div>



                  </div>



                );



              })}



            </div>



          </div>







          {modal && (



            <div className="modal-bg" onClick={close}><div className="modal" onClick={e => e.stopPropagation()}>



              <h3 style={{ fontSize: 17, fontWeight: 800, fontFamily: "'Syne', sans-serif", marginBottom: 16 }}>Fluxo de Serviço</h3>



              <VehicleSelector vehicles={vehicles} value={form.vehicleId} onChange={val => setForm({ ...form, vehicleId: val })} />



              



              <div style={{ marginBottom: 12 }}>



                <label className="label">Defeito / Serviço Principal *</label>



                <textarea 



                  className="textarea"



                  placeholder="Digite o serviço feito aqui..."



                  value={form.description ? form.description.split("||")[0] : ""}



                  onChange={(e) => setForm({ ...form, description: e.target.value })}



                />



              </div>







              <div style={{ marginBottom: 12 }}>



                <label className="label">Quem forneceu as peças?</label>



                <select className="input" value={partsOwner} onChange={e => setPartsOwner(e.target.value)}>



                  <option value="oficina">Oficina comprou tudo (Padrão)</option>



                  <option value="cliente">Cliente trouxe tudo</option>



                  <option value="mista">Fornecimento Misto (Oficina + Cliente)</option>



                </select>



              </div>



              {partsOwner === "mista" && (



                <div style={{ background: "#0b0d14", padding: 12, borderRadius: 10, marginBottom: 12, border: "1px solid #1c2234" }}>



                  <Field label="O que a ASDCAR comprou?" placeholder="Ex: Óleo e Filtro" value={oficinaPartsText} onChange={setOficinaPartsText} />



                  <Field label="O que o Cliente trouxe?" placeholder="Ex: Correia Dentada" value={clientePartsText} onChange={setClientePartsText} />



                </div>



              )}



              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>



                <Field label="KM Atual" type="number" value={form.mileage} onChange={v => setForm({ ...form, mileage: v })} />



                <Field label={partsOwner === "cliente" ? "Peças (Cliente Forneceu)" : "Valor Peças ASDCAR (R$)"} type="number" value={partsOwner === "cliente" ? 0 : form.partsValue} onChange={v => setForm({ ...form, partsValue: v })} disabled={partsOwner === "cliente"} />



              </div>



              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>



                <Field label="Mão de Obra (R$)" type="number" value={form.laborValue} onChange={v => setForm({ ...form, laborValue: v })} />



                <SelectField label="Status" value={form.status || "Aguardando"} onChange={v => setForm({ ...form, status: v })} options={Object.keys(STATUS_COLORS)} />



              </div>



              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>



                <Field label="Entrada" type="date" value={form.entryDate} onChange={v => setForm({ ...form, entryDate: v })} />



                {form.status === "Entregue" && <Field label="Entrega" type="date" value={form.exitDate || today()} onChange={v => setForm({ ...form, exitDate: v })} />}



              </div>







              {form.status === "Entregue" && (



                <div style={{ background: "#0b0d14", padding: 14, borderRadius: 10, border: "1px solid #10b981", marginTop: 10 }}>



                  <label className="label">Forma de Pagamento</label>



                  <select className="input" value={form.paymentMethod} onChange={e => setForm({ ...form, paymentMethod: e.target.value })}>



                    {Object.keys(PAYMENT_METHODS).map(m => <option key={m} value={m}>{m}</option>)}



                    <option value="Múltiplo / Misto">Múltiplo / Misto (Cartão + Pix/Dinheiro)</option>



                  </select>







                  {form.paymentMethod === "Múltiplo / Misto" && (



                    <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px dashed #1c2234" }}>



                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>



                        <Field label="Parte Pix / Dinheiro (R$)" type="number" value={form.mixedCash} onChange={v => setForm({ ...form, mixedCash: v })} />



                        <Field label="Parte Cartão (R$)" type="number" value={form.mixedCard} onChange={v => setForm({ ...form, mixedCard: v })} />



                      </div>



                      <label className="label">Plano do Cartão (Para calcular a taxa)</label>



                      <select className="input" value={form.mixed_card_method || form.mixedCardMethod || "Débito"} onChange={e => setForm({ ...form, mixed_card_method: e.target.value, mixedCardMethod: e.target.value })}>



                        {Object.keys(PAYMENT_METHODS).filter(m => m !== "Dinheiro" && m !== "Pix").map(m => (



                          <option key={m} value={m}>{m}</option>



                        ))}



                      </select>



                    </div>



                  )}



                </div>



              )}







              {/* 📷 MÓDULO DE FOTOS & VISTORIA (GOOGLE DRIVE: CÂMERA & GALERIA) */}



              <div style={{ background: "#0b0d14", padding: 14, borderRadius: 12, border: "1px solid #3b82f6", marginTop: 14, marginBottom: 14 }}>



                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>



                  <label className="label" style={{ color: "#3b82f6", fontSize: 11, fontWeight: 800, margin: 0 }}>



                    📷 REGISTRO FOTOGRÁFICO (GOOGLE DRIVE)



                  </label>



                  <button 



                    type="button" 



                    className="btn-ghost" 



                    style={{ fontSize: 10, padding: "3px 8px", color: driveUrl ? "#10b981" : "#f59e0b", borderColor: driveUrl ? "rgba(16,185,129,0.3)" : "rgba(245,158,11,0.3)" }} 



                    onClick={onOpenDriveConfig}



                  >



                    {driveUrl ? "☁️ Drive Conectado" : "⚙️ Conectar Drive"}



                  </button>



                </div>







                <div style={{ marginBottom: 10 }}>



                  <label className="label" style={{ fontSize: 10 }}>Tipo da Foto / Etapa</label>



                  <select className="input" style={{ fontSize: 11 }} value={photoType} onChange={e => setPhotoType(e.target.value)}>



                    <option value="Vistoria / Avarias">Vistoria / Avarias (Pneus/Riscados)</option>



                    <option value="Diagnóstico / Defeito">Diagnóstico / Peça Com Defeito</option>



                    <option value="Peça Antiga / Nova">Peça Nova vs Antiga</option>



                    <option value="Serviço Concluído">Serviço Concluído</option>



                  </select>



                </div>







                <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} ref={cameraInputRef} onChange={handleUploadPhoto} />



                <input type="file" accept="image/*" style={{ display: "none" }} ref={galleryInputRef} onChange={handleUploadPhoto} />







                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>



                  <button 



                    type="button" 



                    className="btn-primary" 



                    style={{ background: "#3b82f6", color: "#fff", fontSize: 11, padding: "10px", height: "auto" }}



                    onClick={() => {



                      if (!form.vehicleId) return alert("Selecione o veículo primeiro para vincular a foto à placa!");



                      cameraInputRef.current?.click();



                    }}



                    disabled={uploadingPhoto}



                  >



                    {uploadingPhoto ? "⏳ Enviando..." : "📷 Tirar Foto (Câmera)"}



                  </button>







                  <button 



                    type="button" 



                    className="btn-primary" 



                    style={{ background: "#8b5cf6", color: "#fff", fontSize: 11, padding: "10px", height: "auto" }}



                    onClick={() => {



                      if (!form.vehicleId) return alert("Selecione o veículo primeiro para vincular a foto à placa!");



                      galleryInputRef.current?.click();



                    }}



                    disabled={uploadingPhoto}



                  >



                    {uploadingPhoto ? "⏳ Enviando..." : "🖼️ Escolher da Galeria"}



                  </button>



                </div>







                {Array.isArray(form.photos) && form.photos.length > 0 ? (



                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(75px, 1fr))", gap: 8, marginTop: 10 }}>



                    {form.photos.map((photo, idx) => (



                      <div key={idx} style={{ position: "relative", borderRadius: 8, overflow: "hidden", border: "1px solid #1c2234", background: "#000", height: 75 }}>



                        <img 



                          src={photo.url} 



                          alt={photo.type} 



                          style={{ width: "100%", height: "100%", objectFit: "cover", cursor: "pointer" }} 



                          onClick={() => onZoomPhoto(photo)}



                        />



                        <div style={{ position: "absolute", top: 2, left: 2, background: photo.driveSaved || photo.driveLink?.includes("drive") ? "rgba(16,185,129,0.9)" : "rgba(59,130,246,0.9)", color: "#fff", borderRadius: 4, padding: "1px 4px", fontSize: 8, fontWeight: 700 }}>



                          {photo.driveSaved || photo.driveLink?.includes("drive") ? "☁️ Nuvem" : "📱 App"}



                        </div>



                        <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(0,0,0,0.8)", fontSize: 8, color: "#fff", padding: "2px 4px", textOverflow: "ellipsis", overflow: "hidden", whitespace: "nowrap" }}>



                          {photo.type?.slice(0, 12)}



                        </div>



                        <button 



                          type="button" 



                          onClick={(e) => { e.stopPropagation(); handleDeletePhoto(idx); }}



                          style={{ position: "absolute", top: 2, right: 2, background: "rgba(239,68,68,0.9)", color: "#fff", border: "none", borderRadius: "50%", width: 18, height: 18, fontSize: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}



                          title="Excluir foto"



                        >



                          ✕



                        </button>



                      </div>



                    ))}



                  </div>



                ) : (



                  <p style={{ fontSize: 11, color: "#64748b", margin: 0, fontStyle: "italic" }}>



                    Nenhuma foto registrada para este serviço ainda.



                  </p>



                )}



              </div>







              <button className="btn-primary" style={{ width: "100%", marginTop: 12, height: 44 }} onClick={save}>Salvar Informações</button>



            </div></div>



          )}



        </Section>



      );



    }







    // ── ABA HISTÓRICO MENSAL (PASSARAM NO MÊS) ─────────────────────────────────



    function MonthlyHistoryTab({ services, vehicles, onOpenOS, onZoomPhoto, onEditService }) {



      const [selMonth, setSelMonth] = useState(new Date().getMonth());



      const [selYear, setSelYear] = useState(new Date().getFullYear());



      const [query, setQuery] = useState("");







      const filteredServices = services.filter((s) => {



        const d = s.exitDate ? new Date(s.exitDate + "T12:00:00") : new Date(s.entryDate + "T12:00:00");



        const matchesMonth = d.getMonth() === selMonth && d.getFullYear() === selYear;



        



        if (!matchesMonth) return false;



        if (!query) return true;



        



        const q = query.toLowerCase();



        const plate = (s.vehiclePlate || "").toLowerCase();



        const model = (s.vehicleModel || "").toLowerCase();



        const brand = (s.vehicleBrand || "").toLowerCase();



        const desc = (s.description || "").toLowerCase();



        return plate.includes(q) || model.includes(q) || brand.includes(q) || desc.includes(q);



      });







      const totalPecas = filteredServices.reduce((a, s) => a + (Number(s.partsValue) || 0), 0);



      const totalMO = filteredServices.reduce((a, s) => a + (Number(s.laborValue) || 0), 0);



      const totalGeral = totalPecas + totalMO;







      return (



        <Section title="Carros Atendidos no Mês">



          <div className="card" style={{ display: "flex", flexDirection: "column", gap: 12 }}>



            <div style={{ display: "grid", gridTemplateColumns: "1fr 120px 2fr", gap: 12 }}>



              <div>



                <label className="label">MÊS DE REFERÊNCIA</label>



                <select className="input" value={selMonth} onChange={e => setSelMonth(Number(e.target.value))}>



                  {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}



                </select>



              </div>



              <div>



                <label className="label">ANO</label>



                <select className="input" value={selYear} onChange={e => setSelYear(Number(e.target.value))}>



                  {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}



                </select>



              </div>



              <div>



                <label className="label">BUSCAR VEÍCULO OU PLACA</label>



                <input 



                  className="input" 



                  placeholder="Digite a placa, modelo ou serviço..." 



                  value={query} 



                  onChange={e => setQuery(e.target.value)} 



                />



              </div>



            </div>



          </div>







          <div className="kpi-grid">



            <div className="kpi-card" style={{ borderColor: "rgba(249, 115, 22, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(249, 115, 22, 0.15)", color: "#f97316" }}>🚗</div>



              <div className="kpi-number">{filteredServices.length}</div>



              <div className="kpi-label">CARROS ATENDIDOS</div>



            </div>



            <div className="kpi-card" style={{ borderColor: "rgba(139, 92, 246, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(139, 92, 246, 0.15)", color: "#8b5cf6" }}>🎧</div>



              <div className="kpi-number">{fmt(totalPecas)}</div>



              <div className="kpi-label">TOTAL PEÇAS</div>



            </div>



            <div className="kpi-card" style={{ borderColor: "rgba(16, 185, 129, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(16, 185, 129, 0.15)", color: "#10b981" }}>🔧</div>



              <div className="kpi-number">{fmt(totalMO)}</div>



              <div className="kpi-label">TOTAL MÃO DE OBRA</div>



            </div>



            <div className="kpi-card" style={{ borderColor: "rgba(59, 130, 246, 0.3)" }}>



              <div className="kpi-icon-badge" style={{ background: "rgba(59, 130, 246, 0.15)", color: "#3b82f6" }}>💰</div>



              <div className="kpi-number" style={{ color: "#3b82f6" }}>{fmt(totalGeral)}</div>



              <div className="kpi-label">FATURAMENTO TOTAL O.S.</div>



            </div>



          </div>







          <div className="card" style={{ padding: 0 }}>



            <div className="table-wrap">



              <div className="table-header" style={{ gridTemplateColumns: "1.8fr 1.3fr 1fr 1fr 1fr 110px" }}>



                <span>Veículo / Placa</span>



                <span>Serviço Realizado</span>



                <span>Peças (R$)</span>



                <span>M.O. (R$)</span>



                <span>Datas / Pagto</span>



                <span>Ações</span>



              </div>







              {filteredServices.length === 0 ? (



                <div style={{ padding: 40, textAlign: "center", color: "#64748b", fontSize: 13 }}>



                  Nenhum veículo registrado em {MONTHS[selMonth]} de {selYear}.



                </div>



              ) : (



                filteredServices.map((s) => {



                  const car = vehicles.find((v) => v.id === s.vehicleId || v.plate === s.vehiclePlate) || {};



                  const statusClass = "status-" + (s.status || "Entregue").replace(/ /g, "-");



                  const photosList = Array.isArray(s.photos) ? s.photos : [];







                  return (



                    <div key={s.id} className="table-row workshop-car-card" onClick={() => onEditService && onEditService(s)} style={{ gridTemplateColumns: "1.8fr 1.3fr 1fr 1fr 1fr 110px", alignItems: "flex-start", padding: 14, cursor: "pointer" }}>



                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>



                        <div className="plate-badge" style={{ width: 75, padding: 0 }}>



                          <div className="plate-top" style={{ fontSize: 6 }}>BRASIL</div>



                          <div className="plate-number" style={{ fontSize: 11 }}>{s.vehiclePlate}</div>



                        </div>



                        <div>



                          <div style={{ fontSize: 13, fontWeight: 700, color: "#f8fafc" }}>{s.vehicleBrand} {s.vehicleModel}</div>



                          <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 2 }}>



                            {car.owner ? `👤 ${car.owner}` : ""} {car.phone ? `· 📞 ${car.phone}` : ""}



                          </div>



                        </div>



                      </div>







                      <div>



                        <div style={{ fontSize: 12, color: "#f8fafc", fontWeight: 600 }}>{(s.description || "").split("||")[0]}</div>



                        {photosList.length > 0 && (



                          <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>



                            {photosList.slice(0, 3).map((p, idx) => (



                              <img key={idx} src={p.url} alt="Foto" style={{ width: 28, height: 28, borderRadius: 4, objectFit: "cover", cursor: "pointer", border: "1px solid #1c2234" }} onClick={(e) => { e.stopPropagation(); onZoomPhoto(p); }} />



                            ))}



                            {photosList.length > 3 && <span style={{ fontSize: 9, color: "#3b82f6", alignSelf: "center" }}>+{photosList.length - 3} fotos</span>}



                          </div>



                        )}



                      </div>







                      <div style={{ fontSize: 12, fontWeight: 700, color: "#8b5cf6" }}>{fmt(s.partsValue)}</div>



                      <div style={{ fontSize: 12, fontWeight: 800, color: "#10b981" }}>{fmt(s.laborValue)}</div>







                      <div style={{ fontSize: 10, color: "#94a3b8" }}>



                        <div>Entrada: <strong style={{ color: "#f8fafc" }}>{fmtDate(s.entryDate)}</strong></div>



                        <div>Saída: <strong style={{ color: "#10b981" }}>{fmtDate(s.exitDate || s.entryDate)}</strong></div>



                        <div style={{ marginTop: 2, color: "#f59e0b" }}>Pagto: {s.paymentMethod}</div>



                      </div>







                      <div style={{ display: "flex", gap: 6, alignItems: "center" }} onClick={e => e.stopPropagation()}>



                        <button onClick={() => onOpenOS(s)} className="btn-primary" style={{ padding: "6px 10px", background: "#7c3aed", color: "#fff", fontSize: 10 }}>📋 O.S</button>



                        <button onClick={() => onEditService(s)} className="btn-ghost" style={{ padding: 6 }}>✏️</button>



                      </div>



                    </div>



                  );



                })



              )}



            </div>



          </div>



        </Section>



      );



    }







    // ── ABA FINANCEIRO ─────────────────────────────────────────────────────────



    function FinanceTab({ services, expenses, loadAll, viewMode, setViewMãode }) {

      const [modal, setModal] = useState(false);

      const [form, setForm] = useState({ expense_date: today(), status: "pago", repeatMonths: 1 });

      const [selMonth, setSelMonth] = useState(new Date().getMonth());

      const [selYear, setSelYear] = useState(new Date().getFullYear());

      const [statusFilter, setStatusFilter] = useState("todos"); // 'todos' | 'pagos' | 'pendentes'

      const [showCalc, setShowCalc] = useState(false);

      const [calcAmount, setCalcAmount] = useState(1000);



      const EXPENSE_CATEGORIES = [

        "👨‍🔧 Pró-labore / Salários", "🏢 Aluguel", "⚡ Energia / Água", 

        "📜 Impostos / MEI", "🌐 Internet / Telefone", "🧰 Peças & Insumos", 

        "🔧 Ferramentas", "📁 Outros"

      ];



      // Helper para identificar se a despesa está paga

      const isExpensePaid = (e) => {

        if (!e) return false;

        if (e.is_paid !== undefined && e.is_paid !== null) return Boolean(e.is_paid);

        if (e.status) return e.status === "pago" || e.status === "PAGO";

        if (e.description) {

          if (e.description.includes("[PENDENTE]")) return false;

          if (e.description.includes("[PAGO]")) return true;

        }

        return true; // padrão para dados antigos

      };



      const deliveredServices = services.filter(s => s.status === "Entregue" && s.exitDate && new Date(s.exitDate + "T12:00:00").getMonth() === selMonth && new Date(s.exitDate + "T12:00:00").getFullYear() === selYear);



      const totalGrossIn = deliveredServices.reduce((acc, s) => {

        if (viewMode === "labor") return acc + (Number(s.laborValue) || 0);

        return acc + (Number(s.partsValue || 0) + Number(s.laborValue || 0));

      }, 0);



      const totalIn = deliveredServices.reduce((acc, s) => {

        if (s.paymentMethod === "Múltiplo / Misto") {

          const taxaCard = PAYMENT_METHODS[s.mixed_card_method || s.mixedCardMethod || "Débito"] || 0;

          const dinheiroPixLivre = Number(s.mixedCash || 0);

          if (viewMode === "labor") {

            const totalBrutoServico = (Number(s.partsValue) || 0) + (Number(s.laborValue) || 0);

            if (totalBrutoServico <= 0) return acc;

            const percentualLabor = Number(s.laborValue) / totalBrutoServico;

            return acc + (dinheiroPixLivre * percentualLabor) + ((Number(s.mixedCard || 0) * percentualLabor) * (1 - taxaCard / 100));

          } else {

            return acc + dinheiroPixLivre + (Number(s.mixedCard || 0) * (1 - taxaCard / 100));

          }

        }

        const taxa = PAYMENT_METHODS[s.paymentMethod] || 0;

        return viewMode === "labor" ? acc + (Number(s.laborValue || 0) * (1 - taxa / 100)) : acc + (s.netValue || 0);

      }, 0);



      const filteredExp = expenses.filter(e => e.expense_date && new Date(e.expense_date + "T12:00:00").getMonth() === selMonth && new Date(e.expense_date + "T12:00:00").getFullYear() === selYear);



      const totalExpAll = filteredExp.reduce((acc, e) => acc + Number(e.value || 0), 0);

      const totalExpPaid = filteredExp.filter(e => isExpensePaid(e)).reduce((acc, e) => acc + Number(e.value || 0), 0);

      const totalExpPending = filteredExp.filter(e => !isExpensePaid(e)).reduce((acc, e) => acc + Number(e.value || 0), 0);

      const countPaid = filteredExp.filter(e => isExpensePaid(e)).length;

      const countPending = filteredExp.filter(e => !isExpensePaid(e)).length;



      const displayedExp = filteredExp.filter(e => {

        if (statusFilter === "pagos") return isExpensePaid(e);

        if (statusFilter === "pendentes") return !isExpensePaid(e);

        return true;

      });



      // Alternar status pago/pendente com 1 clique direto na lista

      const toggleExpenseStatus = async (exp) => {

        const currentlyPaid = isExpensePaid(exp);

        const nextStatus = !currentlyPaid;

        const cleanDesc = (exp.description || "").replace(/\[(PAGO|PENDENTE)\]\s*/gi, "").trim();

        const updatedDesc = `[${nextStatus ? "PAGO" : "PENDENTE"}] ${cleanDesc}`.trim();

        const updatedRow = {

          id: exp.id,

          category: exp.category,

          value: exp.value,

          supplier: exp.supplier || "Geral",

          expense_date: exp.expense_date,

          description: updatedDesc

        };



        const { error } = await supabaseClient.from("expenses").upsert(updatedRow);

        if (!error) {

          await loadAll(false);

        } else {

          alert("Erro ao alterar status: " + error.message);

        }

      };



      const saveExp = async () => {

        if (!form.category || !form.value) return alert("Preencha categoria e valor.");

        const repeat = (!form.id && Number(form.repeatMonths) > 1) ? Number(form.repeatMonths) : 1;

        const baseDateStr = form.expense_date || today();

        const parts = baseDateStr.split("-");

        const baseYear = parseInt(parts[0], 10);

        const baseMonth = parseInt(parts[1], 10) - 1;

        const baseDay = parseInt(parts[2], 10);



        const rowsToUpsert = [];

        for (let i = 0; i < repeat; i++) {

          let targetYear = baseYear;

          let targetMonth = baseMonth + i;

          while (targetMonth > 11) {

            targetMonth -= 12;

            targetYear += 1;

          }

          const maxDays = new Date(targetYear, targetMonth + 1, 0).getDate();

          const targetDay = Math.min(baseDay, maxDays);

          const dateStr = `${targetYear}-${String(targetMonth + 1).padStart(2, "0")}-${String(targetDay).padStart(2, "0")}`;



          const itemStatus = (i === 0) ? (form.status || "pago") : "pendente";

          const rawNotes = (form.notes || "").replace(/\[(PAGO|PENDENTE)\]\s*/gi, "").trim();

          const desc = `[${itemStatus.toUpperCase()}] ${rawNotes}`.trim();



          rowsToUpsert.push({

            id: i === 0 && form.id ? form.id : uid(),

            category: form.category,

            value: Number(form.value),

            supplier: form.supplier || "Geral",

            expense_date: dateStr,

            description: desc

          });

        }



        const { error } = await supabaseClient.from("expenses").upsert(rowsToUpsert);

        if (!error) {

          await loadAll(false);

          setModal(false);

          setForm({ expense_date: today(), status: "pago", repeatMonths: 1 });

        } else {

          alert("Erro ao salvar: " + error.message);

        }

      };



      const deleteExp = async (id) => {

        if (!confirm("Deseja realmente excluir esta despesa?")) return;

        const { error } = await supabaseClient.from("expenses").delete().eq("id", id);

        if (!error) { await loadAll(false); } else { alert("Erro ao deletar: " + error.message); }

      };



      const openEdit = (e) => {

        const paid = isExpensePaid(e);

        const notes = (e.description || "").replace(/\[(PAGO|PENDENTE)\]\s*/gi, "").trim();

        setForm({

          id: e.id,

          category: e.category,

          value: e.value,

          supplier: e.supplier,

          expense_date: e.expense_date,

          status: paid ? "pago" : "pendente",

          notes: notes,

          repeatMonths: 1

        });

        setModal(true);

      };



      return (

        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

          {/* Cabeçalho de Mês & Ações */}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>

            <div className="card" style={{ display: "flex", gap: 10, alignItems: "center", background: "#1a2030", padding: "10px 14px", flex: 1, minWidth: 260 }}>

              <div style={{ flex: 1 }}>

                <label className="label" style={{ marginBottom: 3 }}>Mês Financeiro</label>

                <select className="input" style={{ padding: "6px 10px", height: 36 }} value={selMonth} onChange={(e) => setSelMonth(Number(e.target.value))}>

                  {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}

                </select>

              </div>

              <div style={{ width: 100 }}>

                <label className="label" style={{ marginBottom: 3 }}>Ano</label>

                <select className="input" style={{ padding: "6px 10px", height: 36 }} value={selYear} onChange={(e) => setSelYear(Number(e.target.value))}>

                  {[2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}

                </select>

              </div>

            </div>



            <div style={{ display: "flex", gap: 8 }}>

              <button 

                onClick={() => setShowCalc(!showCalc)}

                className="btn-ghost"

                style={{ padding: "8px 12px", fontSize: 12, border: "1px solid #334155" }}

              >

                🧮 {showCalc ? "Ocultar Taxas" : "Simulador Taxas"}

              </button>

              <button 

                className="btn-primary" 

                style={{ padding: "8px 14px", fontSize: 13 }}

                onClick={() => { 

                  setForm({ expense_date: today(), status: "pago", repeatMonths: 1, category: "", value: "", supplier: "" }); 

                  setModal(true); 

                }}

              >

                + Lançar Despesa

              </button>

            </div>

          </div>



          {/* Simulador de Maquininha Retrátil */}

          {showCalc && (

            <div className="card" style={{ background: "rgba(59, 130, 246, 0.05)", border: "1px solid #3b82f6" }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>

                <h4 style={{ margin: 0, fontSize: 13, fontWeight: 700, color: "#3b82f6" }}>🧮 Calculadora de Repasse & Taxas de Cartão</h4>

                <span style={{ fontSize: 11, color: "#64748b" }}>1x até 18x</span>

              </div>

              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>

                <label className="label" style={{ marginBottom: 0 }}>Simular Valor (R$):</label>

                <input

                  className="input"

                  type="number"

                  style={{ width: 140, fontWeight: 800, fontSize: 14 }}

                  value={calcAmount}

                  onChange={e => setCalcAmount(Number(e.target.value))}

                />

              </div>

              <div style={{ maxHeight: 220, overflowY: "auto", border: "1px solid #1e2736", borderRadius: 6 }}>

                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>

                  <thead>

                    <tr style={{ background: "#1a2030", textAlign: "left", color: "#94a3b8" }}>

                      <th style={{ padding: "6px 8px" }}>Forma</th>

                      <th style={{ padding: "6px 8px" }}>Taxa</th>

                      <th style={{ padding: "6px 8px" }}>Oficina Recebe</th>

                      <th style={{ padding: "6px 8px" }}>Repasse Cliente</th>

                    </tr>

                  </thead>

                  <tbody>

                    {Object.entries(PAYMENT_METHODS).map(([m, rate]) => {

                      const net = calcAmount * (1 - rate / 100);

                      const grossCharge = rate < 100 ? calcAmount / (1 - rate / 100) : calcAmount;

                      return (

                        <tr key={m} style={{ borderBottom: "1px solid #1e2736" }}>

                          <td style={{ padding: "5px 8px", fontWeight: 700 }}>{m}</td>

                          <td style={{ padding: "5px 8px", color: rate === 0 ? "#10b981" : "#f59e0b" }}>{rate === 0 ? "0%" : `${rate}%`}</td>

                          <td style={{ padding: "5px 8px", color: "#10b981", fontWeight: 700 }}>{fmt(net)}</td>

                          <td style={{ padding: "5px 8px", color: "#3b82f6", fontWeight: 700 }}>{fmt(grossCharge)}</td>

                        </tr>

                      );

                    })}

                  </tbody>

                </table>

              </div>

            </div>

          )}



          {/* Grid de KPIs Financeiros */}

          <div className="kpi-grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))" }}>

            <div className="card" style={{ borderLeft: "3px solid #10b981" }}>

              <label className="label">{viewMode === "labor" ? "Entradas M.O. Líquidas" : "Entradas Totais Líquidas"}</label>

              <div style={{ fontSize: 16, fontWeight: 800, color: "#10b981" }}>{fmt(totalIn)}</div>

            </div>



            <div className="card" style={{ borderLeft: "3px solid #ef4444" }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                <label className="label">Despesas Pagas</label>

                <span style={{ fontSize: 10, color: "#10b981", fontWeight: 700 }}>{countPaid} quitadas</span>

              </div>

              <div style={{ fontSize: 16, fontWeight: 800, color: "#ef4444" }}>{fmt(totalExpPaid)}</div>

            </div>



            <div className="card" style={{ borderLeft: "3px solid #f59e0b" }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                <label className="label">A Pagar (Pendente)</label>

                <span style={{ fontSize: 10, color: "#f59e0b", fontWeight: 700 }}>{countPending} pendentes</span>

              </div>

              <div style={{ fontSize: 16, fontWeight: 800, color: "#f59e0b" }}>{fmt(totalExpPending)}</div>

            </div>



            <div className="card" style={{ borderLeft: `3px solid ${(totalIn - totalExpPaid) >= 0 ? "#10b981" : "#ef4444"}` }}>

              <label className="label">Lucro Líquido Real (Caixa)</label>

              <div style={{ fontSize: 16, fontWeight: 800, color: (totalIn - totalExpPaid) >= 0 ? "#10b981" : "#ef4444" }}>

                {fmt(totalIn - totalExpPaid)}

              </div>

            </div>

          </div>



          {/* Relatório de Gastos com Filtros */}

          <div className="card">

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>

              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                <h3 style={{ fontSize: 13, margin: 0 }}>📋 Relatório de Despesas</h3>

                <span style={{ fontSize: 11, color: "#64748b" }}>Total: {fmt(totalExpAll)}</span>

              </div>



              {/* Filtros de Status */}

              <div style={{ display: "flex", gap: 4, background: "#0f172a", padding: 3, borderRadius: 6 }}>

                <button

                  onClick={() => setStatusFilter("todos")}

                  style={{

                    padding: "4px 8px",

                    fontSize: 11,

                    borderRadius: 4,

                    border: "none",

                    background: statusFilter === "todos" ? "#1e293b" : "transparent",

                    color: statusFilter === "todos" ? "#fff" : "#94a3b8",

                    cursor: "pointer",

                    fontWeight: statusFilter === "todos" ? 700 : 400

                  }}

                >

                  Todas ({filteredExp.length})

                </button>

                <button

                  onClick={() => setStatusFilter("pagos")}

                  style={{

                    padding: "4px 8px",

                    fontSize: 11,

                    borderRadius: 4,

                    border: "none",

                    background: statusFilter === "pagos" ? "rgba(16, 185, 129, 0.2)" : "transparent",

                    color: statusFilter === "pagos" ? "#10b981" : "#94a3b8",

                    cursor: "pointer",

                    fontWeight: statusFilter === "pagos" ? 700 : 400

                  }}

                >

                  🟢 Pagas ({countPaid})

                </button>

                <button

                  onClick={() => setStatusFilter("pendentes")}

                  style={{

                    padding: "4px 8px",

                    fontSize: 11,

                    borderRadius: 4,

                    border: "none",

                    background: statusFilter === "pendentes" ? "rgba(245, 158, 11, 0.2)" : "transparent",

                    color: statusFilter === "pendentes" ? "#f59e0b" : "#94a3b8",

                    cursor: "pointer",

                    fontWeight: statusFilter === "pendentes" ? 700 : 400

                  }}

                >

                  🟡 A Pagar ({countPending})

                </button>

              </div>

            </div>



            {displayedExp.length === 0 ? (

              <p style={{ fontSize: 11, color: "#64748b", margin: "14px 0" }}>Nenhuma despesa encontrada com os filtros atuais.</p>

            ) : (

              displayedExp.map(e => {

                const paid = isExpensePaid(e);

                return (

                  <div key={e.id} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #1e2736", alignItems: "center", gap: 10 }}>

                    <div style={{ fontSize: 11, flex: 1 }}>

                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>

                        <strong>{e.category}</strong>

                        {/* Botão de Toggle de Status Rápido */}

                        <button

                          onClick={() => toggleExpenseStatus(e)}

                          title="Clique para alternar entre Pago e Pendente"

                          style={{

                            fontSize: 10,

                            padding: "2px 6px",

                            borderRadius: 4,

                            border: paid ? "1px solid #10b981" : "1px solid #f59e0b",

                            background: paid ? "rgba(16, 185, 129, 0.15)" : "rgba(245, 158, 11, 0.15)",

                            color: paid ? "#10b981" : "#f59e0b",

                            cursor: "pointer",

                            fontWeight: 700,

                            display: "inline-flex",

                            alignItems: "center",

                            gap: 4

                          }}

                        >

                          {paid ? "✓ PAGO" : "⏳ A PAGAR"}

                        </button>

                      </div>

                      <span style={{ color: "#64748b" }}>

                        {e.supplier || "Geral"} · Venc: {fmtDate(e.expense_date)}

                      </span>

                    </div>



                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

                      <div style={{ fontSize: 13, fontWeight: 800, color: paid ? "#ef4444" : "#f59e0b" }}>

                        -{fmt(e.value)}

                      </div>

                      <button onClick={() => openEdit(e)} className="btn-ghost" style={{ padding: "4px 6px", fontSize: 11 }} title="Editar">✏️</button>

                      <button onClick={() => deleteExp(e.id)} className="btn-ghost" style={{ padding: "4px 6px", fontSize: 11, color: "#ef4444" }} title="Excluir">🗑️</button>

                    </div>

                  </div>

                );

              })

            )}

          </div>



          {/* Modal de Lançamento / Edição de Despesa */}

          {modal && (

            <div className="modal-bg" onClick={() => setModal(false)}>

              <div className="modal" style={{ maxWidth: 440 }} onClick={e => e.stopPropagation()}>

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>

                  <h3 style={{ margin: 0 }}>{form.id ? "Editar Lançamento" : "Novo Gasto Interno ASDCAR"}</h3>

                  <button className="btn-ghost" style={{ fontSize: 14, padding: "2px 8px" }} onClick={() => setModal(false)}>✕</button>

                </div>



                {/* Seletor de Categoria com Presets Rápidos */}

                <div style={{ marginBottom: 12 }}>

                  <label className="label">Categoria do Gasto *</label>

                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>

                    {EXPENSE_CATEGORIES.map(cat => (

                      <button

                        key={cat}

                        type="button"

                        onClick={() => setForm({ ...form, category: cat })}

                        style={{

                          fontSize: 10,

                          padding: "3px 6px",

                          borderRadius: 4,

                          border: form.category === cat ? "1px solid #3b82f6" : "1px solid #334155",

                          background: form.category === cat ? "rgba(59, 130, 246, 0.2)" : "#1e293b",

                          color: form.category === cat ? "#60a5fa" : "#cbd5e1",

                          cursor: "pointer"

                        }}

                      >

                        {cat}

                      </button>

                    ))}

                  </div>

                  <input 

                    className="input" 

                    placeholder="Ex: Pró-labore, Aluguel, MEI..." 

                    value={form.category || ""} 

                    onChange={e => setForm({ ...form, category: e.target.value })} 

                  />

                </div>



                <Field label="Valor Pago / Parcela (R$) *" type="number" value={form.value || ""} onChange={v => setForm({ ...form, value: v })} />
