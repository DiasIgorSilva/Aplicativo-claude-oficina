                <Field label="Fornecedor / Destino" placeholder="Ex: Igor, Imobiliária, CPFL..." value={form.supplier || ""} onChange={v => setForm({ ...form, supplier: v })} />

                <Field label="Data de Vencimento / Pagamento" type="date" value={form.expense_date || ""} onChange={v => setForm({ ...form, expense_date: v })} />



                {/* Status: Pago vs Pendente */}

                <div style={{ marginBottom: 12 }}>

                  <label className="label">Status do Pagamento</label>

                  <div style={{ display: "flex", gap: 8 }}>

                    <button

                      type="button"

                      onClick={() => setForm({ ...form, status: "pago" })}

                      style={{

                        flex: 1,

                        padding: "8px",

                        borderRadius: 6,

                        border: form.status === "pago" ? "2px solid #10b981" : "1px solid #334155",

                        background: form.status === "pago" ? "rgba(16, 185, 129, 0.2)" : "#1e293b",

                        color: form.status === "pago" ? "#10b981" : "#94a3b8",

                        fontWeight: 700,

                        fontSize: 12,

                        cursor: "pointer"

                      }}

                    >

                      🟢 Já Pago (Quitado)

                    </button>

                    <button

                      type="button"

                      onClick={() => setForm({ ...form, status: "pendente" })}

                      style={{

                        flex: 1,

                        padding: "8px",

                        borderRadius: 6,

                        border: form.status === "pendente" ? "2px solid #f59e0b" : "1px solid #334155",

                        background: form.status === "pendente" ? "rgba(245, 158, 11, 0.2)" : "#1e293b",

                        color: form.status === "pendente" ? "#f59e0b" : "#94a3b8",

                        fontWeight: 700,

                        fontSize: 12,

                        cursor: "pointer"

                      }}

                    >

                      🟡 Pendente (A Pagar)

                    </button>

                  </div>

                </div>



                {/* Recorrência para múltiplos meses (Apenas para novos lançamentos) */}

                {!form.id && (

                  <div style={{ marginBottom: 14, background: "rgba(59, 130, 246, 0.08)", padding: 10, borderRadius: 6, border: "1px solid rgba(59, 130, 246, 0.25)" }}>

                    <label className="label" style={{ color: "#60a5fa", display: "flex", alignItems: "center", gap: 5 }}>

                      🔄 Repetir lançamento por quantos meses?

                    </label>

                    <select

                      className="input"

                      value={form.repeatMonths || 1}

                      onChange={e => setForm({ ...form, repeatMonths: Number(e.target.value) })}

                    >

                      <option value={1}>Apenas este mês (1x)</option>

                      <option value={2}>Repetir por 2 meses</option>

                      <option value={3}>Repetir por 3 meses</option>

                      <option value={6}>Repetir por 6 meses</option>

                      <option value={12}>Repetir por 12 meses (1 ano)</option>

                      <option value={24}>Repetir por 24 meses (2 anos)</option>

                    </select>

                    {Number(form.repeatMonths) > 1 && (

                      <span style={{ fontSize: 10, color: "#94a3b8", marginTop: 4, display: "block" }}>

                        ℹ️ Serão gerados {form.repeatMonths} lançamentos mensais automáticos no mesmo dia. Os meses futuros serão criados como Pendentes.

                      </span>

                    )}

                  </div>

                )}



                <button className="btn-primary" style={{ width: "100%", marginTop: 10 }} onClick={saveExp}>

                  {form.id ? "Salvar Alterações" : (Number(form.repeatMonths) > 1 ? `Gerar ${form.repeatMonths} Lançamentos` : "Salvar Lançamento")}

                </button>

              </div>

            </div>

          )}

        </div>

      );

    }







    // ── ABA BASE DE VEÍCULOS ──────────────────────────────────────────────────



    function VehiclesTab({ vehicles = [], services = [], loadAll, onZoomPhoto }) {

      const [modal, setModal] = useState(false);

      const [historyModal, setHistoryModal] = useState(false);

      const [selectedV, setSelectedV] = useState(null);

      const [editing, setEditing] = useState(null);

      const [search, setSearch] = useState("");

      const [form, setForm] = useState({});

      const [showBrandRanking, setShowBrandRanking] = useState(false);



      const safeVehicles = Array.isArray(vehicles) ? vehicles : [];

      const safeServices = Array.isArray(services) ? services : [];



      const brandRanking = useMemo(() => {

        const counts = {};

        safeVehicles.forEach(v => {

          if (v && v.brand && v.brand.trim()) {

            const b = v.brand.trim();

            counts[b] = (counts[b] || 0) + 1;

          }

        });

        return Object.entries(counts)

          .map(([brand, count]) => ({ brand, count }))

          .sort((a, b) => b.count - a.count);

      }, [safeVehicles]);

      

      const open = (v = null) => { setEditing(v); setForm(v || {}); setModal(true); };

      const close = () => { setModal(false); setEditing(null); setForm({}); };



      const save = async () => {

        if (!form.plate || !form.brand || !form.model) return alert("Dados obrigatórios faltando (Placa, Marca e Modelo).");

        const row = { 

          id: editing?.id || uid(), 

          plate: (form.plate || "").toUpperCase().trim(), 

          brand: form.brand || "", 

          model: form.model || "", 

          year: form.year || "", 

          engine: form.engine || "", 

          color: form.color || "", 

          owner: form.owner || "", 

          phone: form.phone || "", 

          notes: form.notes || "", 

          mileage: Number(form.mileage) || 0 

        };

        const { error } = await supabaseClient.from("vehicles").upsert(row);

        if (!error) { await loadAll(false); close(); } else { alert("Erro ao salvar: " + error.message); }

      };



      const filtered = safeVehicles.filter(v => 

        !search || 

        (v?.plate || "").toLowerCase().includes(search.toLowerCase()) || 

        (v?.owner || "").toLowerCase().includes(search.toLowerCase()) || 

        (v?.brand || "").toLowerCase().includes(search.toLowerCase()) || 

        (v?.model || "").toLowerCase().includes(search.toLowerCase())

      );



      return (

        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

          {/* BANNER DE ESTATÍSTICAS E RANKING */}

          <div className="card" style={{ background: "var(--surface-card)", border: "1px solid var(--border)", padding: "18px 20px", borderRadius: 16, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 14 }}>

            <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>

              <div style={{ background: "rgba(56, 189, 248, 0.12)", border: "1px solid rgba(56, 189, 248, 0.3)", borderRadius: 12, padding: "12px 16px", display: "flex", alignItems: "center", gap: 12 }}>

                <span style={{ fontSize: 24 }}>🚗</span>

                <div>

                  <div style={{ fontSize: 11, color: "var(--text-muted)", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>Veículos Cadastrados</div>

                  <div style={{ fontSize: 22, fontWeight: 800, color: "var(--text)" }}>{safeVehicles.length} <span style={{ fontSize: 13, fontWeight: 500, color: "#38bdf8" }}>carros</span></div>

                </div>

              </div>



              <div style={{ background: "rgba(249, 115, 22, 0.12)", border: "1px solid rgba(249, 115, 22, 0.3)", borderRadius: 12, padding: "12px 16px", display: "flex", alignItems: "center", gap: 12 }}>

                <span style={{ fontSize: 24 }}>🏷️</span>

                <div>

                  <div style={{ fontSize: 11, color: "var(--text-muted)", fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.5 }}>Marcas no Banco</div>

                  <div style={{ fontSize: 22, fontWeight: 800, color: "var(--text)" }}>{brandRanking.length} <span style={{ fontSize: 13, fontWeight: 500, color: "#f97316" }}>marcas ativas</span></div>

                </div>

              </div>

            </div>



            <button 

              className="btn btn-secondary" 

              onClick={() => setShowBrandRanking(!showBrandRanking)}

              style={{ padding: "10px 16px", fontSize: 12, display: "flex", alignItems: "center", gap: 8, background: showBrandRanking ? "var(--surface-overlay)" : "var(--surface)", border: "1px solid var(--border)", borderRadius: 10, cursor: "pointer", color: "var(--text)", fontWeight: 600 }}

            >

              📊 {showBrandRanking ? "Ocultar Ranking de Marcas" : "Ver Ranking de Marcas"}

              <span style={{ fontSize: 10, background: "#f97316", color: "#fff", padding: "2px 8px", borderRadius: 10, fontWeight: 800 }}>{brandRanking.length}</span>

            </button>

          </div>



          {/* PAINEL EXPANSÍVEL DE RANKING DE MARCAS */}

          {showBrandRanking && (

            <div className="card" style={{ background: "var(--surface)", border: "1px solid var(--border)", padding: 18, borderRadius: 16 }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, borderBottom: "1px solid var(--border)", paddingBottom: 10 }}>

                <div style={{ fontSize: 14, fontWeight: 700, color: "var(--text)", display: "flex", alignItems: "center", gap: 8 }}>

                  🏆 Ranking de Marcas Cadastradas (Mais para Menos)

                </div>

                <span style={{ fontSize: 11, color: "var(--text-muted)" }}>Clique em uma marca para filtrar a lista</span>

              </div>



              {brandRanking.length === 0 ? (

                <div style={{ fontSize: 12, color: "var(--text-muted)", textAlign: "center", padding: 14 }}>Nenhuma marca registrada em carros cadastrados.</div>

              ) : (

                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>

                  {brandRanking.map((item, idx) => (

                    <button

                      key={item.brand}

                      onClick={() => setSearch(search === item.brand ? "" : item.brand)}

                      style={{

                        background: search === item.brand ? "rgba(249, 115, 22, 0.25)" : "var(--surface-card)",

                        border: `1px solid ${search === item.brand ? "#f97316" : "var(--border)"}`,

                        color: "var(--text)",

                        borderRadius: 10,

                        padding: "8px 14px",

                        fontSize: 12,

                        cursor: "pointer",

                        display: "flex",

                        alignItems: "center",

                        gap: 8,

                        transition: "all 0.15s ease"

                      }}

                      title={`Filtrar por ${item.brand}`}

                    >

                      <span style={{ color: idx === 0 ? "#f59e0b" : idx === 1 ? "#94a3b8" : idx === 2 ? "#b45309" : "var(--text-muted)", fontWeight: 800, fontSize: 11 }}>

                        #{idx + 1}

                      </span>

                      <span style={{ fontWeight: 700 }}>{item.brand}</span>

                      <span style={{ background: "var(--surface)", color: "#38bdf8", padding: "2px 8px", borderRadius: 6, fontSize: 10, fontWeight: 700, border: "1px solid var(--border)" }}>

                        {item.count} carro{item.count > 1 ? "s" : ""}

                      </span>

                    </button>

                  ))}

                  {search && (

                    <button 

                      onClick={() => setSearch("")} 

                      style={{ background: "rgba(239, 68, 68, 0.15)", border: "1px solid rgba(239, 68, 68, 0.4)", color: "#ef4444", borderRadius: 10, padding: "8px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}

                    >

                      ✕ Limpar Filtros

                    </button>

                  )}

                </div>

              )}

            </div>

          )}



          {/* BARRA DE BUSCA E BOTÃO NOVO VEÍCULO */}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>

            <div style={{ position: "relative", flex: "1 1 280px" }}>

              <input 

                className="input" 

                placeholder="🔍 Buscar por placa, cliente, marca ou modelo..." 

                value={search} 

                onChange={e => setSearch(e.target.value)} 

                style={{ width: "100%", paddingLeft: "14px" }}

              />

            </div>

            <button className="btn btn-primary" onClick={() => open()} style={{ padding: "10px 18px", fontSize: 13 }}>

              + Novo Cadastro de Veículo

            </button>

          </div>



          {/* LISTA DE CARROS EM CARDS ELEGANTES */}

          <div className="list-container" style={{ display: "flex", flexDirection: "column", gap: 10 }}>

            {filtered.length === 0 ? (

              <div className="card empty-state" style={{ background: "var(--surface-card)", color: "var(--text-muted)", padding: 40, textAlign: "center" }}>

                🚗 Nenhum veículo cadastrado ou encontrado com essa busca.

              </div>

            ) : (

              filtered.map(v => {

                const vehicleServices = safeServices.filter(s => s && s.vehicleId === v.id);

                return (

                  <div key={v.id} className="item-card vehicle-row-card">

                    {/* COLUNA 1: PLACA (LARGURA FIXA ALINHADA) */}

                    <div style={{ display: "flex", alignItems: "center" }}>

                      <span className="plate-badge" style={{ width: 90, textAlign: "center" }}>

                        <span className="plate-top">BRASIL</span>

                        <span className="plate-number">{v.plate}</span>

                      </span>

                    </div>



                    {/* COLUNA 2: MARCA, MODELO, MOTORIZAÇÃO, ANO, KM */}

                    <div style={{ minWidth: 0 }}>

                      <div style={{ fontSize: 15, fontWeight: 700, color: "var(--text)", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>

                        <span>{v.brand} {v.model}</span>

                        {v.engine ? (

                          <span style={{ background: "rgba(56, 189, 248, 0.15)", color: "#38bdf8", border: "1px solid rgba(56, 189, 248, 0.3)", padding: "2px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700 }}>

                            ⚡ {v.engine}

                          </span>

                        ) : null}

                      </div>

                      <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 4 }}>

                        Ano: <strong style={{ color: "var(--text)" }}>{v.year || "—"}</strong> · KM: <strong style={{ color: "#38bdf8" }}>{fmtKm(v.mileage)}</strong>

                      </div>

                    </div>



                    {/* COLUNA 3: PROPRIETÁRIO & CONTATO (COLUNA ALINHADA) */}

                    <div style={{ minWidth: 0 }}>

                      <div style={{ fontSize: 10, color: "var(--text-muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 }}>PROPRIETÁRIO</div>

                      <div style={{ fontSize: 13, fontWeight: 700, color: "var(--text)", marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>

                        {v.owner || "Sem cliente vinculado"}

                      </div>

                      <div style={{ fontSize: 12, color: "#4ade80", marginTop: 2, display: "flex", alignItems: "center", gap: 4 }}>

                        📱 {v.phone || "Sem telefone"}

                      </div>

                    </div>



                    {/* COLUNA 4: AÇÕES (HISTÓRICO E EDITAR ALINHADOD À DIREITA) */}

                    <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "flex-end" }}>

                      <button 

                        onClick={() => { setSelectedV(v); setHistoryModal(true); }} 

                        className="btn btn-secondary" 

                        style={{ padding: "8px 12px", fontSize: 12, display: "flex", alignItems: "center", gap: 6, borderRadius: 8 }}

                      >

                        📜 Histórico ({vehicleServices.length})

                      </button>

                      <button 

                        onClick={() => open(v)} 

                        className="icon-btn" 

                        title="Editar Veículo"

                        style={{ width: 36, height: 36, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}

                      >

                        <span style={{ fontSize: 14 }}>✏️</span>

                      </button>

                    </div>

                  </div>

                );

              })

            )}

          </div>

          

          {/* MODAL DE CADASTRO / EDIÇÃO (POPUP CENTRALIZADO) */}

          {modal && (

            <div className="modal-bg" onClick={close}>

              <div className="modal" onClick={e => e.stopPropagation()}>

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, borderBottom: "1px solid #1c2234", paddingBottom: 12 }}>

                  <h3 style={{ fontSize: 18, fontWeight: 800, color: "#ffffff", margin: 0 }}>{editing ? "Editar Registro do Veículo" : "Novo Cadastro Automotivo"}</h3>

                  <button onClick={close} className="btn-ghost" style={{ padding: "4px 10px", fontSize: 14 }}>✕</button>

                </div>



                <div className="form-group">

                  <label className="label">Placa do Veículo (Mercosul / Tradicional) *</label>

                  <input 

                    className="input" 

                    placeholder="Ex: ABC1D23 ou ABC-1234" 

                    value={form.plate || ""} 

                    onChange={e => setForm({ ...form, plate: e.target.value.toUpperCase() })} 

                  />

                </div>



                <BrandSelector value={form.brand || ""} onChange={(val) => setForm({ ...form, brand: val })} />



                <div className="form-group">

                  <label className="label">Modelo *</label>

                  <input className="input" placeholder="Ex: Corolla XEI, Gol G5" value={form.model || ""} onChange={e => setForm({ ...form, model: e.target.value })} />

                </div>



                <div className="form-grid-3" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>

                  <div className="form-group">

                    <label className="label">Ano</label>

                    <input className="input" placeholder="Ex: 2018" value={form.year || ""} onChange={e => setForm({ ...form, year: e.target.value })} />

                  </div>

                  <div className="form-group">

                    <label className="label">Motorização</label>

                    <input className="input" placeholder="Ex: 1.0, 1.6, 2.0" value={form.engine || ""} onChange={e => setForm({ ...form, engine: e.target.value })} />

                  </div>

                  <div className="form-group">

                    <label className="label">KM Inicial</label>

                    <input className="input" type="number" placeholder="0" value={form.mileage || ""} onChange={e => setForm({ ...form, mileage: e.target.value })} />

                  </div>

                </div>



                <div className="form-group">

                  <label className="label">Cliente / Proprietário</label>

                  <input className="input" placeholder="Nome do Dono do Veículo" value={form.owner || ""} onChange={e => setForm({ ...form, owner: e.target.value })} />

                </div>



                <div className="form-group">

                  <label className="label">Telefone / WhatsApp</label>

                  <input className="input" placeholder="Ex: (11) 99999-9999" value={form.phone || ""} onChange={e => setForm({ ...form, phone: e.target.value })} />

                </div>



                <button className="btn btn-primary" style={{ width: "100%", marginTop: "20px" }} onClick={save}>

                  Confirmar Cadastro / Alterações

                </button>

              </div>

            </div>

          )}

          

          {/* MODAL DE HISTÓRICO DE SERVIÇOS (POPUP CENTRALIZADO) */}

          {historyModal && (

            <div className="modal-bg" onClick={() => setHistoryModal(false)}>

              <div className="modal" style={{ maxWidth: 600 }} onClick={e => e.stopPropagation()}>

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, borderBottom: "1px solid #1c2234", paddingBottom: 10 }}>

                  <h3 style={{ fontSize: 18, fontWeight: 800, color: "#ffffff", margin: 0 }}>Histórico de Serviços: {selectedV?.plate}</h3>

                  <button onClick={() => setHistoryModal(false)} className="btn-ghost" style={{ padding: "4px 10px", fontSize: 14 }}>✕</button>

                </div>



                <div style={{ background: "var(--surface)", padding: 14, borderRadius: 10, marginBottom: 16, fontSize: 13, border: "1px solid var(--border)" }}>

                  <strong>Proprietário:</strong> {selectedV?.owner || "Sem nome registrado"} <br/>

                  <strong>Veículo:</strong> {selectedV?.brand} {selectedV?.model} {selectedV?.year ? `(${selectedV.year})` : ""} {selectedV?.engine ? `· Motor: ${selectedV.engine}` : ""}

                </div>



                <div style={{ maxHeight: 350, overflowY: "auto" }}>

                  {safeServices.filter(s => s && s.vehicleId === selectedV?.id).length === 0 ? (

                    <div className="empty-state" style={{ padding: 20, textAlign: "center", color: "var(--text-muted)" }}>Este veículo ainda não possui serviços registrados no banco.</div>

                  ) : (

                    safeServices.filter(s => s && s.vehicleId === selectedV?.id).map(s => (

                      <div key={s.id} style={{ padding: 14, background: "var(--surface-card)", borderRadius: 10, marginBottom: 10, border: "1px solid var(--border)", borderLeft: `4px solid ${STATUS_COLORS[s?.status] || "var(--border)"}` }}>

                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>

                          <span style={{ fontSize: 13, fontWeight: 700, color: "var(--text)" }}>{(s?.description || "").replace(/\|\|/g, " · ")}</span>

                          <span className={`badge badge-${statusClass(s?.status)}`}>{s?.status || "Aguardando"}</span>

                        </div>

                        <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 6, display: "flex", gap: 12 }}>

                          <span>KM: {fmtKm(s?.mileage)}</span>

                          <span>Data: {fmtDate(s?.exitDate || s?.entryDate)}</span>

                        </div>

                        <div style={{ fontSize: 13, fontWeight: 700, color: "var(--success)", marginTop: 6 }}>

                          Total: {fmt((Number(s?.partsValue) || 0) + (Number(s?.laborValue) || 0))}

                        </div>

                      </div>

                    ))

                  )}

                </div>



                <button className="btn btn-secondary" style={{ width: "100%", marginTop: 16 }} onClick={() => setHistoryModal(false)}>Fechar Histórico</button>

              </div>

            </div>

          )}

        </div>

      );

    }



    function ReportModal({ onClose, onGenerate }) {



      const [from, setFrom] = useState(today().slice(0, 8) + "01");



      const [to, setTo] = useState(today());



      return (



        <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e => e.stopPropagation()}>



          <h3>Gerar Fechamento Comercial</h3>



          <Field label="Data Início" type="date" value={from} onChange={setFrom} />



          <Field label="Data Fim" type="date" value={to} onChange={setTo} />



          <button className="btn-primary" style={{width:"100%", marginTop:10}} onClick={() => onGenerate(from, to)}>Compilar Relatório Master</button>



        </div></div>



      );



    }







    // ── JANELA DA O.S ────────────────────────────────────────────────────────



    function OSModal({ service, vehicles, onClose }) {



      const [email, setEmail] = useState("");



      const car = vehicles.find(v => v.id === service.vehicleId) || {};



      return (



        <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e => e.stopPropagation()}>



          <h3>Emitir O.S. — ASDCAR</h3>



          <div style={{marginBottom:10}}><label className="label">Cliente</label><input className="input" value={car.owner || "—"} disabled /></div>



          <Field label="E-mail do Cliente (Opcional)" value={email} onChange={setEmail} type="email" />



          <button className="btn-primary" style={{width:"100%", marginTop:10, background:"#7c3aed", color:"#fff"}} onClick={() => { generateOSFile(service, car, email); onClose(); }}>Gerar Via de Impressão</button>



        </div></div>



      );



    }







    function Section({ title, action, children }) { return (<div style={{ display: "flex", flexDirection: "column", gap: 12 }}><div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}><h1 style={{ fontFamily: "'Syne',sans-serif", fontSize: 20, fontWeight: 800 }}>{title}</h1>{action}</div>{children}</div>); }



    function StatusBadge({ status, map }) { const color = (map || {})[status] || "#6b7280"; return <span className="badge" style={{ background: color + "22", color, border: `1px solid ${color}44` }}>{status || "—"}</span>; }



    function Field({ label, value, onChange, type = "text", disabled = false, placeholder = "" }) { return <div style={{ marginBottom: 10 }}><label className="label">{label}</label><input className="input" placeholder={placeholder} type={type} value={value || ""} onChange={e => onChange(e.target.value)} disabled={disabled} /></div>; }



    function SelectField({ label, value, onChange, options }) { return <div style={{ marginBottom: 10 }}><label className="label">{label}</label><select className="input" value={value} onChange={e => onChange(e.target.value)}>{options.map(o => <option key={o} value={o}>{o}</option>)}</select></div>; }







    // ── GERADORES DE DOCUMENTOS COMPLETOS ─────────────────────────────────────



    function generateOSFile(s, car, email) {



      const tBruto = Number(s.partsValue || 0) + Number(s.laborValue || 0);



      let escopoPrincipal = s.description || "";



      let blocoPecasMistas = "";



      if (s.description?.includes("|| Peças Oficina:")) {



        const blocos = (s.description || "").split("||");



        escopoPrincipal = blocos[0].trim();



        blocoPecasMistas = "<div style='margin-top:15px; padding:10px; background:#f8fafc; border-radius:4px; border:1px solid #e2e8f0;'><p style='margin-bottom:4px;'>⚙️ <strong>Peças fornecidas pela ASDCAR:</strong> " + (blocos[1]?.replace("Peças Oficina:", "")?.trim() || "") + "</p><p>👤 <strong>Peças trazidas pelo Cliente:</strong> " + (blocos[2]?.replace("Peças Cliente:", "")?.trim() || "") + " <em>(Cliente forneceu)</em></p></div>";



      } else if (s.description?.includes("(Cliente forneceu as peças)")) {



        escopoPrincipal = (s.description || "").replace("(Cliente forneceu as peças)", "").trim();



        blocoPecasMistas = "<div style='margin-top:10px; color:#64748b; font-style:italic;'>⚠️ Nota: Todas as peças para este serviço foram fornecidas pelo próprio cliente.</div>";



      }







      const html = "<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'/><title>ASDCAR - Mecânica Automotiva</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;font-size:12px;color:#0f172a;padding:40px;}.os-border{border:2px dashed #000;padding:30px;}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:15px;margin-bottom:20px;}.grid-ficha{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px;background:#f8fafc;padding:15px;border:1px solid #e2e8f0;}h2{font-size:13px;text-transform:uppercase;margin:20px 0 10px 0;border-left:4px solid #000;padding-left:8px;}.box-servico{border:1px solid #e2e8f0;padding:15px;min-height:80px;line-height:1.5;background:#fff;margin-bottom:20px;}.termos{font-size:10px;color:#475569;margin:30px 0;text-align:justify;}.assinaturas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px;text-align:center;}.linha-sub{border-top:1px solid #000;padding-top:6px;font-size:11px;font-weight:bold;}.no-print{background:#7c3aed;color:white;padding:14px;text-align:center;font-weight:bold;cursor:pointer;margin-bottom:25px;border-radius:8px;border:none;width:100%;font-size:15px;}@media print{.no-print{display:none;}body{padding:0;}.os-border{border:none;}}</style></head><body><button class='no-print' onclick='window.print()'>CLIQUE AQUI PARA IMPRIMIR VIA DO CLIENTE</button><div class='os-border'><div class='hdr'><div><strong style='font-size:24px;letter-spacing:1px;'>ASDCAR</strong><br/><span style='color:#475569;'>Mecânica Automotiva</span></div><div style='text-align:right;'><strong>ORDEM DE SERVIÇO</strong><br/>Data Entrada: " + fmtDate(s.entryDate) + "<br/>Status: <strong>" + s.status + "</strong></div></div><h2>👤 Ficha do Cliente</h2><div class='grid-ficha'><div>Nome: <strong>" + (car.owner || '—') + "</strong><br/>Telefone: <strong>" + (car.phone || '—') + "</strong></div><div>E-mail: <strong>" + (email || 'Não informado') + "</strong></div></div><h2>🚗 Identificação do Veículo</h2><div class='grid-ficha'><div>Placa: <strong style='text-transform:uppercase;'>" + s.vehiclePlate + "</strong><br/>Modelo: <strong>" + (s.vehicleBrand || car.brand) + " " + (s.vehicleModel || car.model) + "</strong></div><div>Ano: <strong>" + (car.year || '—') + "</strong><br/>KM Entrada: <strong>" + fmtKm(s.mileage) + "</strong></div></div><h2>⚙️ Serviços Solicitados / Diagnóstico</h2><div class='box-servico'><strong>" + escopoPrincipal + "</strong>" + blocoPecasMistas + "</div><h2>💰 Valores e Condição de Pagamento</h2><div class='grid-ficha'><div>Valor Peças: <strong>" + fmt(s.partsValue) + "</strong><br/>Mão de Obra: <strong>" + fmt(s.laborValue) + "</strong><br/><span style='font-size:14px;color:#000;'>Total da O.S.: <strong>" + fmt(tBruto) + "</strong></span></div><div>Forma de Pagamento: <strong>" + s.paymentMethod + "</strong></div></div><div class='termos'><strong>TERMOS DE GARANTIA E CONDIÇÕES:</strong><br/>1. A garantia dos serviços executados é de 90 dias a contar da data de entrega do veículo, cobrindo exclusivamente defeitos de mão de obra.<br/>2. Peças fornecidas pelo cliente não possuem garantia pela oficina ASDCAR.<br/>3. Veículos não retirados em até 5 dias após a notificação de término estarão sujeitos a taxa de diária de permanência.</div><div class='assinaturas'><div><div class='linha-sub'>ASDCAR Mecânica Automotiva</div></div><div><div class='linha-sub'>Assinatura do Cliente / De acordo</div></div></div></div></body></html>";



      const w = window.open("", "_blank");



      if (w) { w.document.write(html); w.document.close(); }



    }







    function generatePDF(vehicles, services, expenses, fromStr, toStr, viewMode = "labor") {



      const from = new Date(fromStr + "T00:00:00");



      const to = new Date(toStr + "T23:59:59");



      const relServices = services.filter(s => { if (s.status !== "Entregue" || !s.exitDate) return false; const d = new Date(s.exitDate + "T12:00:00"); return d >= from && d <= to; });



      const relExpenses = expenses.filter(e => { if (!e.expense_date) return false; const d = new Date(e.expense_date + "T12:00:00"); return d >= from && d <= to; });







      const totalPecas = relServices.reduce((a, s) => a + (Number(s.partsValue) || 0), 0);



      const totalMO = relServices.reduce((a, s) => a + (Number(s.laborValue) || 0), 0);







      const faturamentoLiquido = relServices.reduce((acc, s) => {



        if (s.paymentMethod === "Múltiplo / Misto") {



          const taxaCard = PAYMENT_METHODS[s.mixedCardMethod] || 0;



          const dinheiroPixLivre = Number(s.mixedCash || 0);



          if (viewMode === "labor") {



            const totalBrutoServico = (Number(s.partsValue) || 0) + (Number(s.laborValue) || 0);



            if (totalBrutoServico <= 0) return acc;



            const percentualLabor = Number(s.laborValue) / totalBrutoServico;



            return acc + (dinheiroPixLivre * percentualLabor) + (Number(s.mixedCard || 0) * percentualLabor * (1 - taxaCard / 100));



          } else {



            return acc + dinheiroPixLivre + (Number(s.mixedCard || 0) * (1 - taxaCard / 100));



          }



        }



        const taxa = PAYMENT_METHODS[s.paymentMethod] || 0;



        if (viewMode === "labor") { return acc + (Number(s.laborValue || 0) * (1 - taxa / 100)); }



        else { return acc + (s.netValue || 0); }



      }, 0);







      const totalDespesas = relExpenses.reduce((a, e) => a + (Number(e.value) || 0), 0);



      const resultadoReal = faturamentoLiquido - totalDespesas;







      const html = "<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'/><title>ASDCAR - Mecânica Automotiva</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;font-size:11px;color:#0f172a;padding:30px;}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f97316;padding-bottom:12px;margin-bottom:20px;}.kpi-box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}.kpi{background:#f8fafc;border:1px solid #e2e8f0;padding:10px;border-radius:6px;}.kpi-lbl{font-size:9px;color:#64748b;text-transform:uppercase;}.kpi-val{font-size:14px;font-weight:bold;margin-top:2px;}table{width:100%;border-collapse:collapse;margin-bottom:20px;}th,td{padding:8px;border:1px solid #e2e8f0;text-align:left;}th{background:#f1f5f9;font-size:9px;text-transform:uppercase;}.no-print{background:#f97316;color:white;padding:12px;text-align:center;font-weight:bold;cursor:pointer;margin-bottom:20px;border-radius:6px;border:none;width:100%;font-size:14px;}@media print{.no-print{display:none;}body{padding:0;}}</style></head><body><button class='no-print' onclick='window.print()'>CLIQUE AQUI PARA IMPRIMIR OU SALVAR EM PDF</button><div class='hdr'><div><strong style='font-size:22px;color:#f97316;'>ASDCAR</strong><br/><span>Fechamento Comercial</span></div><div style='text-align:right;'>Período: <strong>" + fmtDate(fromStr) + " até " + fmtDate(toStr) + "</strong></div></div><div class='kpi-box'><div class='kpi'><div class='kpi-lbl'>Peças Totais</div><div class='kpi-val' style='color:#8b5cf6;'>" + fmt(totalPecas) + "</div></div><div class='kpi'><div class='kpi-lbl'>Mão de Obra</div><div class='kpi-val' style='color:#10b981;'>" + fmt(totalMO) + "</div></div><div class='kpi'><div class='kpi-lbl'>Entradas Líquidas</div><div class='kpi-val' style='color:#3b82f6;'>" + fmt(faturamentoLiquido) + "</div></div><div class='kpi'><div class='kpi-lbl'>Resultado Real</div><div class='kpi-val' style='color:" + (resultadoReal >= 0 ? '#10b981' : '#ef4444') + ";'>" + fmt(resultadoReal) + "</div></div></div><h3>📋 Serviços Entregues (" + relServices.length + ")</h3><table><thead><tr><th>Veículo</th><th>Descrição / Obs.</th><th>Forma Pagto</th><th>Peças</th><th>M.O.</th><th>Saída</th></tr></thead><tbody>" + relServices.map(s => "<tr><td><strong>" + s.vehiclePlate + "</strong><br/>" + s.vehicleBrand + " " + s.vehicleModel + "</td><td>" + (s.description || "").replace(/\|\|/g, '<br/>') + "</td><td>" + s.paymentMethod + "</td><td>" + fmt(s.partsValue) + "</td><td>" + fmt(s.laborValue) + "</td><td>" + fmtDate(s.exitDate) + "</td></tr>").join('') + "</tbody></table><h3>💸 Despesas do Período (" + relExpenses.length + ")</h3><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Data</th><th>Valor</th></tr></thead><tbody>" + relExpenses.map(e => "<tr><td>" + e.description + "</td><td>" + e.category + "</td><td>" + fmtDate(e.expense_date) + "</td><td style='color:#ef4444;font-weight:bold;'>-" + fmt(e.value) + "</td></tr>").join('') + "</tbody></table></body></html>";



      const w = window.open("", "_blank");



      if (w) { w.document.write(html); w.document.close(); }



    }







    ReactDOM.createRoot(document.getElementById("root")).render(<App />);



  </script>
